<script>
  let currentAmount = 90000;

  function updateAmountView() {
    const el = document.getElementById('amountDisplay');
    if (el) {
      el.textContent = currentAmount.toLocaleString('vi-VN');
    }
  }

  function addAmount(delta) {
    currentAmount += delta;
    updateAmountView();
  }

  function clearAmount() {
    currentAmount = 0;
    updateAmountView();
  }

  function switchType(type) {
    const expenseBtn = document.getElementById('tabExpense');
    const incomeBtn = document.getElementById('tabIncome');
    const transferBtn = document.getElementById('tabTransfer');
    const amountDisplay = document.getElementById('amountDisplay');

    [expenseBtn, incomeBtn, transferBtn].forEach(btn => {
      btn.className = "flex-1 py-2 rounded-full font-label-lg text-label-lg text-center transition-all text-on-surface-variant hover:text-on-surface flex items-center justify-center gap-1";
    });

    if (type === 'expense') {
      expenseBtn.className = "flex-1 py-2 rounded-full font-label-lg text-label-lg text-center transition-all bg-primary text-on-primary shadow-sm flex items-center justify-center gap-1";
      if (amountDisplay) amountDisplay.parentElement.className = "flex items-center justify-center text-primary font-display-currency-mobile text-display-currency-mobile";
    } else if (type === 'income') {
      incomeBtn.className = "flex-1 py-2 rounded-full font-label-lg text-label-lg text-center transition-all bg-secondary text-on-secondary shadow-sm flex items-center justify-center gap-1";
      if (amountDisplay) amountDisplay.parentElement.className = "flex items-center justify-center text-secondary font-display-currency-mobile text-display-currency-mobile";
    } else {
      transferBtn.className = "flex-1 py-2 rounded-full font-label-lg text-label-lg text-center transition-all bg-tertiary text-on-tertiary shadow-sm flex items-center justify-center gap-1";
      if (amountDisplay) amountDisplay.parentElement.className = "flex items-center justify-center text-tertiary font-display-currency-mobile text-display-currency-mobile";
    }
  }

  function selectCategory(buttonEl, catName) {
    document.querySelectorAll('.cat-pill').forEach(btn => {
      btn.classList.remove('bg-primary-fixed/40');
      btn.classList.add('bg-surface-container-low');
      const textSpan = btn.querySelector('span:last-child');
      if (textSpan) {
        textSpan.classList.remove('font-bold', 'text-on-surface');
        textSpan.classList.add('text-on-surface-variant');
      }
    });

    buttonEl.classList.remove('bg-surface-container-low');
    buttonEl.classList.add('bg-primary-fixed/40');
    const activeText = buttonEl.querySelector('span:last-child');
    if (activeText) {
      activeText.classList.remove('text-on-surface-variant');
      activeText.classList.add('font-bold', 'text-on-surface');
    }

    const label = document.getElementById('selectedCategoryLabel');
    if (label) label.textContent = catName;
  }

  function triggerAiParse() {
    const input = document.getElementById('aiPromptInput');
    if (!input) return;
    input.value = "Hôm nay tôi ăn trưa 50 nghìn ở Highlands";
    applyAiDraft();
  }

  function applyAiDraft() {
    currentAmount = 50000;
    updateAmountView();

    const noteInput = document.getElementById('noteInput');
    if (noteInput) noteInput.value = "Ăn trưa Highlands";

    const catGrid = document.getElementById('categoryGrid');
    if (catGrid) {
      const firstBtn = catGrid.querySelector('button');
      if (firstBtn) selectCategory(firstBtn, 'Ăn uống');
    }

    const toast = document.createElement('div');
    toast.className = 'fixed bottom-24 left-1/2 -translate-x-1/2 bg-inverse-surface text-inverse-on-surface px-4 py-2 rounded-full text-label-md font-label-md shadow-lg z-50 flex items-center gap-2';
    toast.innerHTML = '<span class="material-symbols-outlined text-[16px] text-tertiary-fixed">check_circle</span> Đã áp dụng gợi ý từ AI!';
    document.body.appendChild(toast);
    setTimeout(() => toast.remove(), 2200);
  }

  function handleSaveTransaction() {
    const btn = document.getElementById('submitBtn');
    if (!btn) return;
    btn.innerHTML = '<span class="material-symbols-outlined text-[22px] animate-spin">progress_activity</span> Đang lưu...';
    btn.disabled = true;

    setTimeout(() => {
      btn.innerHTML = '<span class="material-symbols-outlined text-[22px]">done_all</span> Đã lưu thành công!';
      btn.classList.remove('bg-primary');
      btn.classList.add('bg-tertiary');
      setTimeout(() => {
        window.history.back();
      }, 700);
    }, 600);
  }

  document.getElementById('topSaveBtn')?.addEventListener('click', handleSaveTransaction);
</script></main>



</body></html>
